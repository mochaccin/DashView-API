name: Build, Test, and Deploy

on:
  # run workflow on changes to master
  push:
    branches:
      - main
  # run workflow on changes pull requests that is merging to master
  pull_request:
    branches:
      - main

  # let user run the workflow manually
  workflow_dispatch:

jobs:
  # job 1: build project, build docker image, and upload image to docker hub
  build-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean install

      - name: Run tests
        run: mvn test

      - name: Compile
        run: mvn compile

      - name: Package
        run: mvn package

      - name: Build docker image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/viewdashapi .

      - name: Log into Docker and upload image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
          docker push ${{secrets.DOCKER_USERNAME}}/viewdashapi

  deploy:
    needs: [ build-docker-image ]
    runs-on: ubuntu-latest
    environment:
      name: 'Production'

    steps:
      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            whoami
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/viewdashapi:latest
            sudo docker stop ViewdashApiContainer
            sudo docker run --rm -d -p 8080:8080 --name ViewdashApiContainer ${{ secrets.DOCKER_USERNAME }}/viewdashapi:latest